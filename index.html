<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Turbo Coin Racer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#070707;touch-action:none;font-family:Arial,sans-serif}
#game{position:fixed;inset:0;overflow:hidden;background:#19752b}
canvas{position:absolute;inset:0;width:100%;height:100%}
#rotate{display:none;position:fixed;inset:0;z-index:99;background:#050505;color:#fff;align-items:center;justify-content:center;text-align:center;font-size:25px}
@media(orientation:portrait){#game{display:none}#rotate{display:flex}}
#hud{position:absolute;z-index:10;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.p{background:#07100ddd;color:#fff;border:1px solid #ffd21c;border-radius:12px;padding:6px 10px;font-size:12px;font-weight:bold}
.leftHud,.rightHud{display:flex;flex-direction:column;gap:5px}
.bar{width:100px;height:6px;background:#222;border-radius:8px;overflow:hidden}
#hp{height:100%;width:100%;background:#20df83}
#pause{position:absolute;z-index:20;right:12px;top:58px;width:38px;height:38px;border-radius:50%;background:#07100ddd;color:#fff;border:1px solid #fff8}
#controls{position:absolute;z-index:30;left:0;right:0;bottom:12px;height:95px}
.c{position:absolute;border-radius:50%;background:#07100dd9;color:#fff;border:2px solid #ffffff88;font-weight:bold}
#left,#right{width:72px;height:72px;bottom:4px;font-size:27px}
#left{left:18px}#right{left:96px}
#action{right:18px;bottom:0;width:92px;height:92px;background:#ff7900;border-color:#ffd28a;font-size:12px;line-height:18px}
#action.slow{background:#1976d2}
#action.stop{background:#d80019}
#menu,#over,#garage{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#000b;padding:15px}
#over,#garage{display:none}
.panel{width:min(450px,90vw);background:#111d;color:#fff;border:1px solid #ffffff33;border-radius:22px;padding:22px;text-align:center}
h1{color:#ffd21c;font-size:30px;margin-bottom:8px}
.sub{color:#aaa;margin-bottom:18px}
button.main{border:0;border-radius:13px;padding:12px 18px;margin:4px;font-weight:bold;font-size:16px;background:#ffd21c}
button.green{background:#25d66f}button.dark{background:#444;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}
.car{background:#20242a;color:#fff;border:1px solid #555;border-radius:12px;padding:9px}
.preview{height:40px;width:25px;background:var(--c);border-radius:7px;margin:auto auto 5px}
</style>
</head>
<body>
<div id="rotate">📱<br><b>Please Rotate Your Device</b><br><small>Turn your phone sideways to play.</small></div>

<div id="game">
<canvas id="cv"></canvas>
<div id="hud">
 <div class="leftHud">
  <div class="p">🏆 SCORE <span id="score">0</span></div>
  <div class="p">🪙 <span id="coins">0</span></div>
  <div class="bar"><div id="hp"></div></div>
 </div>
 <div class="rightHud">
  <div class="p">LEVEL <span id="level">1</span></div>
  <div class="p"><span id="dist">0</span> M</div>
 </div>
</div>
<button id="pause">Ⅱ</button>

<div id="controls">
 <button class="c" id="left">◀</button>
 <button class="c" id="right">▶</button>
 <button class="c" id="action">⚡<br>SPEED</button>
</div>

<div id="menu"><div class="panel">
 <h1>🏎️ TURBO COIN RACER</h1>
 <div class="sub">Slow, smooth racing • Dodge cars • Collect coins</div>
 <button class="main" id="play">▶ PLAY</button>
 <button class="main green" id="open">🚗 CARS</button>
</div></div>

<div id="garage"><div class="panel">
 <h1>🚗 GARAGE</h1><div class="sub">Coins: 🪙 <b id="gc">0</b></div>
 <div class="grid" id="grid"></div>
 <button class="main dark" id="back">BACK</button>
</div></div>

<div id="over"><div class="panel">
 <h1>💥 GAME OVER</h1>
 <div class="sub">Score: <b id="fs">0</b> • Distance: <b id="fd">0</b>M</div>
 <button class="main" id="again">🔄 PLAY AGAIN</button>
 <button class="main dark" id="home">HOME</button>
</div></div>
</div>

<script>
const c=document.getElementById("cv"),x=c.getContext("2d"),G=document.getElementById("game");
let W,H,dpr,road,rx,px,run=false,last=0,spawn=0,score=0,coins=+localStorage.coins||0,dist=0,hp=100,level=1,mode=0,objs=[];
const cars=[
["Red Racer","#ed2224",0],["Blue Flash","#1687ff",35],["Green Beast","#19c957",80],
["Gold King","#ffb20f",150],["Purple Turbo","#a52cff",250],["Neon Rocket","#00d9ff",400]
];
let selected=+localStorage.car||0,unlocked=JSON.parse(localStorage.unlocked||"[0]");

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 c.width=W*dpr;c.height=H*dpr;c.style.width=W+"px";c.style.height=H+"px";x.setTransform(dpr,0,0,dpr,0,0);
 road=Math.max(310,Math.min(W*.62,700));rx=(W-road)/2;
 px=Math.max(rx+35,Math.min(rx+road-35,px||W/2));
}resize();addEventListener("resize",resize);

function fs(){
 document.documentElement.requestFullscreen?.({navigationUI:"hide"}).catch(()=>{});
 screen.orientation?.lock?.("landscape").catch(()=>{});
}
function hud(){
 scoreEl.textContent=Math.floor(score);coinsEl.textContent=coins;distEl.textContent=Math.floor(dist);
 levelEl.textContent=level;hpEl.style.width=hp+"%";gc.textContent=coins;
}
const scoreEl=document.getElementById("score"),coinsEl=document.getElementById("coins"),distEl=document.getElementById("dist"),
levelEl=document.getElementById("level"),hpEl=document.getElementById("hp"),gc=document.getElementById("gc");

function save(){localStorage.coins=coins;localStorage.car=selected;localStorage.unlocked=JSON.stringify(unlocked)}
function tone(f=400,d=.07){
 try{let a=new AudioContext,o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);setTimeout(()=>a.close(),200)}catch(e){}
}
function roadDraw(){
 x.fillStyle="#19802f";x.fillRect(0,0,W,H);
 let s=90,o=(dist*1.3)%s;
 for(let y=-o;y<H;y+=s){
  x.fillStyle=((y/s&1)?"#1a8530":"#17752b");x.fillRect(0,y,rx,s);x.fillRect(rx+road,y,W-rx-road,s);
 }
 x.fillStyle="#303238";x.fillRect(rx,0,road,H);
 x.fillStyle="#d8d8d8";x.fillRect(rx,0,4,H);x.fillRect(rx+road-4,0,4,H);
 let d=65,g=80,off=(dist*1.7)%(d+g);x.fillStyle="#fff";
 for(let y=-off;y<H;y+=d+g){x.fillRect(rx+road/3-2,y,5,d);x.fillRect(rx+road*2/3-2,y,5,d)}
 // trees on both sides
 for(let y=-((dist*.7)%180)-30;y<H+180;y+=180){
  tree(rx-38,y+30,1);tree(rx+road+38,y+80,1.05);
 }
}
function tree(a,b,z){
 x.save();x.translate(a,b);x.fillStyle="#663b1c";x.fillRect(-5,25,10,35);
 x.fillStyle="#075d27";x.beginPath();x.arc(0,20,25*z,0,7);x.arc(-15,30,19*z,0,7);x.arc(15,30,19*z,0,7);x.fill();
 x.fillStyle="#0b8737";x.beginPath();x.arc(0,7,20*z,0,7);x.fill();x.restore();
}
function car(a,b,col,z=1){
 let w=45*z,h=75*z;x.fillStyle="#0008";round(a-w/2+3,b+4,w,h,10);
 x.fillStyle=col;round(a-w/2,b,w,h,10);x.fillStyle="#111";
 x.fillRect(a-w/2-4,b+14,7,19);x.fillRect(a+w/2-3,b+14,7,19);
 x.fillRect(a-w/2-4,b+h-30,7,19);x.fillRect(a+w/2-3,b+h-30,7,19);
 x.fillStyle="#55d9ff";round(a-w*.3,b+10,w*.6,24,6);
 x.fillStyle="#ffdf22";round(a-w*.3,b+h-17,w*.6,9,3);
}
function round(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function coin(a,b){
 x.shadowBlur=12;x.shadowColor="#ffd21c";x.fillStyle="#ffd21c";x.beginPath();x.arc(a,b,13,0,7);x.fill();
 x.shadowBlur=0;x.fillStyle="#9b6200";x.font="bold 13px Arial";x.textAlign="center";x.fillText("$",a,b+4);
}
function add(){
 let lane=Math.floor(Math.random()*3),lw=road/3;
 objs.push({t:Math.random()<.58?"c":"e",x:rx+lw*(lane+.5),y:-90});
}
function hit(a,b){return Math.abs(a.x-b.x)<34&&Math.abs(a.y-b.y)<60}

function start(){
 fs();document.getElementById("menu").style.display="none";document.getElementById("over").style.display="none";
 score=0;dist=0;hp=100;level=1;objs=[];spawn=0;mode=0;px=rx+road/2;run=true;last=performance.now();requestAnimationFrame(loop);
}
function end(){
 run=false;document.getElementById("fs").textContent=Math.floor(score);document.getElementById("fd").textContent=Math.floor(dist);
 document.getElementById("over").style.display="flex";save();tone(90,.25);
}
function loop(t){
 if(!run)return;
 let dt=Math.min(35,t-last);last=t;
 // NORMAL SPEED: deliberately slow and easy to control
 let sp=2.8+(level*.035);
 if(mode===1)sp=1.7;                 // SLOW
 if(mode===2)sp=0;                   // STOP
 if(mode===3)sp=4.2;                 // controlled SPEED
 dist+=sp*dt*.045;score+=sp*dt*.018;level=1+Math.floor(dist/900);
 roadDraw();
 spawn+=dt;
 if(sp>0&&spawn>1350){add();spawn=0} // coins/enemies come slowly
 for(let o of objs){
  o.y+=sp*dt*.72;
  o.t==="c"?coin(o.x,o.y):car(o.x,o.y,cars[(selected+1)%cars.length][1],.9);
  if(hit({x:px,y:H-125},o)){
   if(o.t==="c"){coins++;score+=20;o.dead=1;tone(900,.05);save()}
   else{hp-=30;o.dead=1;tone(120,.1);if(hp<=0){end();return}}
  }
  if(o.y>H+100)o.dead=1;
 }
 objs=objs.filter(o=>!o.dead);
 car(px,H-125,cars[selected][1],1);hud();requestAnimationFrame(loop);
}
function move(n){if(run&&mode!==2){px+=n*42;px=Math.max(rx+30,Math.min(rx+road-30,px));tone(170,.03)}}
function action(){
 if(!run)return;
 mode=(mode+1)%4;
 let b=document.getElementById("action");
 if(mode===0){b.innerHTML="⚡<br>SPEED";b.className="c"}
 if(mode===1){b.innerHTML="🐢<br>SLOW";b.className="c slow"}
 if(mode===2){b.innerHTML="⛔<br>STOP";b.className="c stop"}
 if(mode===3){b.innerHTML="⚡<br>SPEED+";b.className="c"}
 tone(mode===2?100:mode===1?220:500,.08);
}
function garage(){
 document.getElementById("menu").style.display="none";document.getElementById("garage").style.display="flex";
 let q=document.getElementById("grid");q.innerHTML="";
 cars.forEach((z,i)=>{let b=document.createElement("button");b.className="car";
 b.innerHTML='<div class="preview" style="--c:'+z[1]+'"></div>'+z[0]+'<br><small>'+(unlocked.includes(i)?(i===selected?"✓ SELECTED":"SELECT"):"🔒 "+z[2])+'</small>';
 b.onclick=()=>{if(unlocked.includes(i))selected=i;else if(coins>=z[2]){coins-=z[2];unlocked.push(i);selected=i;tone(800,.1)}save();garage();hud()};q.appendChild(b)});
}
document.getElementById("play").onclick=start;document.getElementById("again").onclick=start;
document.getElementById("open").onclick=()=>{fs();garage()};
document.getElementById("back").onclick=()=>{document.getElementById("garage").style.display="none";document.getElementById("menu").style.display="flex"};
document.getElementById("home").onclick=()=>{run=false;document.getElementById("over").style.display="none";document.getElementById("menu").style.display="flex"};
document.getElementById("pause").onclick=()=>{if(run){run=false;document.getElementById("pause").textContent="▶"}else{run=true;last=performance.now();document.getElementById("pause").textContent="Ⅱ";requestAnimationFrame(loop)}};
document.getElementById("left").onpointerdown=e=>{e.preventDefault();fs();move(-1)};
document.getElementById("right").onpointerdown=e=>{e.preventDefault();fs();move(1)};
document.getElementById("action").onpointerdown=e=>{e.preventDefault();fs();action()};
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1);if(e.code==="Space")action()});
hud();roadDraw();
</script>
</body>
</html>
