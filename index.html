<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Color Rush Car World</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#38bdf8;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    z-index:10;
    display:flex;
    justify-content:space-between;
    gap:6px;
    pointer-events:none;
}

.hudBox{
    color:#fff;
    background:rgba(0,0,0,.55);
    border:2px solid rgba(255,255,255,.8);
    border-radius:14px;
    padding:7px 10px;
    font-weight:bold;
    font-size:13px;
    text-shadow:1px 2px 3px #000;
}

#shopBtn,#pauseBtn{
    position:fixed;
    top:62px;
    z-index:20;
    border:2px solid white;
    color:white;
    border-radius:15px;
    padding:9px 13px;
    font-weight:bold;
    box-shadow:0 5px 12px #0007;
}

#shopBtn{
    left:10px;
    background:#8b5cf6;
}

#pauseBtn{
    right:10px;
    background:#ef4444;
}

#controls{
    position:fixed;
    left:0;
    right:0;
    bottom:18px;
    height:125px;
    z-index:30;
    pointer-events:none;
}

.control{
    position:absolute;
    width:74px;
    height:74px;
    border-radius:50%;
    border:4px solid white;
    color:white;
    font-size:12px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow:0 6px 16px #0009;
    user-select:none;
    pointer-events:auto;
}

.control:active{
    transform:scale(.88);
}

#left{
    left:15px;
    bottom:20px;
    background:#2563eb;
}

#right{
    left:100px;
    bottom:20px;
    background:#7c3aed;
}

#speedBox{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:10px;
    width:105px;
    text-align:center;
    pointer-events:none;
}

#speed{
    font-size:26px;
    font-weight:900;
    color:white;
    text-shadow:2px 2px 4px #000;
}

#speedLabel{
    color:#fff;
    font-size:11px;
    font-weight:bold;
}

#gas{
    right:100px;
    bottom:20px;
    background:#16a34a;
}

#nitro{
    right:15px;
    bottom:20px;
    width:78px;
    height:78px;
    background:#f97316;
}

#mudStatus{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:145px;
    z-index:20;
    color:white;
    background:rgba(0,0,0,.55);
    padding:7px 14px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    display:none;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ef4444,#7c3aed,#2563eb,#16a34a);
}

.panel{
    width:min(92%,420px);
    max-height:90vh;
    overflow:auto;
    padding:25px;
    border-radius:28px;
    background:rgba(0,0,0,.65);
    border:3px solid white;
    color:white;
    text-align:center;
    box-shadow:0 20px 60px #0009;
}

.panel h1{
    font-size:34px;
    margin-bottom:8px;
    text-shadow:3px 3px #000;
}

.mainBtn{
    border:0;
    padding:14px 28px;
    border-radius:25px;
    color:white;
    font-weight:bold;
    font-size:18px;
    background:#ef4444;
    margin:7px;
}

.carGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.carCard{
    padding:12px;
    border-radius:18px;
    background:rgba(255,255,255,.13);
    border:2px solid rgba(255,255,255,.3);
}

.carPreview{
    width:55px;
    height:82px;
    margin:5px auto 8px;
    border-radius:15px;
    border:3px solid white;
}

.buyBtn{
    border:0;
    padding:8px 12px;
    border-radius:15px;
    color:white;
    background:#16a34a;
    font-weight:bold;
}

.locked{
    background:#6b7280;
}

#shop{
    display:none;
}

#gameOver{
    display:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div class="hudBox">🪙 <span id="coins">0</span></div>
    <div class="hudBox">🏆 <span id="score">0</span></div>
    <div class="hudBox">🚗 <span id="carName">RED SPORT</span></div>
</div>

<button id="shopBtn">🚗 SHOP</button>
<button id="pauseBtn">⏸ PAUSE</button>

<div id="mudStatus"></div>

<div id="controls">
    <div class="control" id="left">◀<br>LEFT</div>
    <div class="control" id="right">RIGHT<br>▶</div>

    <div id="speedBox">
        <div id="speed">0</div>
        <div id="speedLabel">KM/H</div>
    </div>

    <div class="control" id="gas">▲<br>SPEED</div>
    <div class="control" id="nitro">🔥<br>NITRO</div>
</div>

<!-- START -->
<div class="overlay" id="startScreen">
    <div class="panel">
        <h1>🏎️ COLOR RUSH</h1>
        <p>Collect coins • Buy cars • Race • Wash your car</p>
        <button class="mainBtn" id="startBtn">START RACE 🚀</button>
        <button class="mainBtn" id="openShopStart">CAR SHOP 🚗</button>
    </div>
</div>

<!-- SHOP -->
<div class="overlay" id="shop">
    <div class="panel">
        <h1>🚗 CAR SHOP</h1>
        <p>Coins: 🪙 <b id="shopCoins">0</b></p>

        <div class="carGrid" id="carGrid"></div>

        <button class="mainBtn" id="closeShop">CLOSE</button>
    </div>
</div>

<!-- PAUSE -->
<div class="overlay" id="pauseScreen" style="display:none">
    <div class="panel">
        <h1>⏸ PAUSED</h1>
        <button class="mainBtn" id="resumeBtn">▶ RESUME</button>
        <button class="mainBtn" id="pauseShop">🚗 SHOP</button>
    </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,dpr;

function resize(){
    dpr=Math.min(devicePixelRatio||1,2);

    W=innerWidth;
    H=innerHeight;

    canvas.width=W*dpr;
    canvas.height=H*dpr;
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
resize();

/* ---------------- SAVE DATA ---------------- */

const defaultCars=[
    {
        id:0,
        name:"RED SPORT",
        color:"#ef4444",
        price:0,
        speed:1,
        handling:1,
        nitro:1
    },
    {
        id:1,
        name:"BLUE GT",
        color:"#2563eb",
        price:500,
        speed:1.15,
        handling:1.05,
        nitro:1.1
    },
    {
        id:2,
        name:"YELLOW X",
        color:"#facc15",
        price:1000,
        speed:1.25,
        handling:1.1,
        nitro:1.2
    },
    {
        id:3,
        name:"GREEN PRO",
        color:"#22c55e",
        price:1500,
        speed:1.35,
        handling:1.18,
        nitro:1.25
    },
    {
        id:4,
        name:"PURPLE MAX",
        color:"#a855f7",
        price:2500,
        speed:1.5,
        handling:1.25,
        nitro:1.35
    },
    {
        id:5,
        name:"ORANGE FIRE",
        color:"#f97316",
        price:4000,
        speed:1.7,
        handling:1.35,
        nitro:1.5
    }
];

let saved=JSON.parse(localStorage.getItem("colorRushSave")||"null");

if(!saved){
    saved={
        coins:0,
        owned:[0],
        selected:0
    };
}

let gameCoins=saved.coins||0;
let selected=saved.selected||0;
let owned=saved.owned||[0];

function saveGame(){
    localStorage.setItem("colorRushSave",JSON.stringify({
        coins:gameCoins,
        owned:owned,
        selected:selected
    }));
}

function currentCar(){
    return defaultCars.find(c=>c.id===selected)||defaultCars[0];
}

/* ---------------- GAME ---------------- */

let running=false;
let paused=false;

let score=0;
let roadScroll=0;

let roadCurve=0;
let curveTarget=0;

let player={
    x:0,
    y:0,
    speed:0,
    angle:0,
    dirt:0
};

let traffic=[];
let coins=[];
let puddles=[];
let muds=[];
let particles=[];

let spawnTimer=0;
let coinTimer=0;
let surfaceTimer=0;

const keys={
    left:false,
    right:false,
    gas:false,
    nitro:false
};

function startGame(){

    running=true;
    paused=false;

    score=0;
    roadScroll=0;

    player.x=W/2;
    player.y=H*.58;
    player.speed=0;
    player.angle=0;
    player.dirt=0;

    traffic=[];
    coins=[];
    puddles=[];
    muds=[];
    particles=[];

    document.getElementById("startScreen").style.display="none";
    document.getElementById("pauseScreen").style.display="none";

    requestFullscreen();
}

async function requestFullscreen(){
    try{
        if(document.documentElement.requestFullscreen)
            await document.documentElement.requestFullscreen();
    }catch(e){}
}

/* ---------------- ROAD ---------------- */

function roadWidth(){
    return Math.min(W*.72,620);
}

function roadCenter(y){
    return W/2 + roadCurve*Math.sin((y+roadScroll)*.004);
}

function roadLeft(y){
    return roadCenter(y)-roadWidth()/2;
}

function roadRight(y){
    return roadCenter(y)+roadWidth()/2;
}

function drawWorld(){

    /* SKY */

    let sky=ctx.createLinearGradient(0,0,0,H);

    sky.addColorStop(0,"#38bdf8");
    sky.addColorStop(.55,"#93c5fd");
    sky.addColorStop(1,"#dbeafe");

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);

    /* SUN */

    ctx.fillStyle="#fde047";
    ctx.beginPath();
    ctx.arc(W*.82,80,43,0,Math.PI*2);
    ctx.fill();

    /* GRASS */

    ctx.fillStyle="#22c55e";
    ctx.fillRect(0,0,W,H);

    /* ROAD */

    ctx.beginPath();

    for(let y=0;y<=H;y+=20){
        let x=roadLeft(y);
        if(y===0)ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }

    for(let y=H;y>=0;y-=20){
        ctx.lineTo(roadRight(y),y);
    }

    ctx.closePath();

    let roadGradient=ctx.createLinearGradient(0,0,W,0);
    roadGradient.addColorStop(0,"#374151");
    roadGradient.addColorStop(.5,"#6b7280");
    roadGradient.addColorStop(1,"#374151");

    ctx.fillStyle=roadGradient;
    ctx.fill();

    /* ROAD EDGES */

    ctx.lineWidth=8;
    ctx.strokeStyle="#ffffff";

    ctx.beginPath();

    for(let y=0;y<=H;y+=15){
        let x=roadLeft(y);
        if(y===0)ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }

    ctx.stroke();

    ctx.beginPath();

    for(let y=0;y<=H;y+=15){
        let x=roadRight(y);
        if(y===0)ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }

    ctx.stroke();

    /* LANE LINES */

    ctx.lineWidth=6;
    ctx.setLineDash([45,55]);
    ctx.lineDashOffset=roadScroll;

    ctx.strokeStyle="#fde047";

    for(let lane=1;lane<3;lane++){

        ctx.beginPath();

        for(let y=0;y<=H;y+=20){

            let x=roadLeft(y)+roadWidth()*lane/3;

            if(y===0)ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }

        ctx.stroke();
    }

    ctx.setLineDash([]);

    drawEnvironment();
}

function drawEnvironment(){

    let gap=130;

    for(let y=-100;y<H+150;y+=gap){

        let yy=y+(roadScroll*.55%gap);

        let center=roadCenter(yy);

        drawTree(center-roadWidth()/2-75,yy);
        drawTree(center+roadWidth()/2+75,yy+50);

        if(Math.floor((y+500)/gap)%3===0){
            drawBush(center-roadWidth()/2-35,yy+60);
            drawBush(center+roadWidth()/2+35,yy+30);
        }
    }
}

function drawTree(x,y){

    ctx.fillStyle="#92400e";
    ctx.fillRect(x-6,y+20,12,42);

    ctx.fillStyle="#166534";

    ctx.beginPath();
    ctx.arc(x,y,31,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#22c55e";

    ctx.beginPath();
    ctx.arc(x-15,y+8,23,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#4ade80";

    ctx.beginPath();
    ctx.arc(x+12,y-7,17,0,Math.PI*2);
    ctx.fill();
}

function drawBush(x,y){

    ctx.fillStyle="#15803d";

    ctx.beginPath();
    ctx.arc(x,y,18,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#4ade80";

    ctx.beginPath();
    ctx.arc(x-10,y,12,0,Math.PI*2);
    ctx.fill();
}

/* ---------------- CAR ---------------- */

function drawPlayer(){

    let car=currentCar();

    ctx.save();

    ctx.translate(player.x,player.y);
    ctx.rotate(player.angle);

    /* shadow */

    ctx.fillStyle="#0008";

    ctx.beginPath();
    ctx.ellipse(0,12,39,62,0,0,Math.PI*2);
    ctx.fill();

    /* wheels */

    ctx.fillStyle="#111827";

    ctx.fillRect(-34,-42,12,30);
    ctx.fillRect(22,-42,12,30);
    ctx.fillRect(-34,15,12,30);
    ctx.fillRect(22,15,12,30);

    /* body */

    let g=ctx.createLinearGradient(-30,0,30,0);

    g.addColorStop(0,"#111827");
    g.addColorStop(.18,car.color);
    g.addColorStop(.5,"#ffffff");
    g.addColorStop(.58,car.color);
    g.addColorStop(1,"#111827");

    ctx.fillStyle=g;

    roundRect(-29,-55,58,110,16);
    ctx.fill();

    /* dirt overlay */

    if(player.dirt>0){

        ctx.fillStyle=`rgba(101,55,20,${player.dirt/100})`;

        roundRect(-28,-54,56,108,15);
        ctx.fill();
    }

    /* windows */

    ctx.fillStyle="#0ea5e9";
    roundRect(-18,-25,36,35,9);
    ctx.fill();

    ctx.fillStyle="#bae6fd";
    ctx.fillRect(-13,-20,10,23);

    /* center stripe */

    ctx.fillStyle="#facc15";
    ctx.fillRect(-3,-52,6,97);

    /* headlights */

    ctx.fillStyle="#ffffff";
    ctx.shadowBlur=18;
    ctx.shadowColor="#ffffff";

    ctx.fillRect(-22,-50,13,8);
    ctx.fillRect(9,-50,13,8);

    ctx.shadowBlur=0;

    /* bumper */

    ctx.fillStyle="#111827";
    roundRect(-20,45,40,8,4);
    ctx.fill();

    /* water shine */

    if(player.dirt<10){

        ctx.fillStyle="rgba(255,255,255,.5)";
        ctx.fillRect(-19,10,7,25);
        ctx.fillRect(12,10,7,25);
    }

    /* NITRO */

    if(keys.nitro && player.speed>2){

        ctx.fillStyle="#f97316";

        ctx.beginPath();
        ctx.moveTo(-15,53);
        ctx.lineTo(-4,53);
        ctx.lineTo(-10,90+Math.random()*15);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(4,53);
        ctx.lineTo(15,53);
        ctx.lineTo(10,90+Math.random()*15);
        ctx.fill();
    }

    ctx.restore();
}

function roundRect(x,y,w,h,r){

    ctx.beginPath();
    ctx.roundRect(x,y,w,h,r);
}

/* ---------------- TRAFFIC ---------------- */

function spawnTraffic(){

    let lanes=[.18,.5,.82];

    let lane=lanes[Math.floor(Math.random()*lanes.length)];

    let y=-130;

    traffic.push({
        x:roadLeft(y)+roadWidth()*lane,
        y:y,
        color:["#2563eb","#facc15","#22c55e","#a855f7","#f97316"][Math.floor(Math.random()*5)],
        speed:1+Math.random()*3
    });
}

function drawTraffic(){

    traffic.forEach(t=>{

        ctx.save();

        ctx.translate(t.x,t.y);

        ctx.fillStyle="#111827";

        ctx.fillRect(-30,-40,11,25);
        ctx.fillRect(19,-40,11,25);
        ctx.fillRect(-30,15,11,25);
        ctx.fillRect(19,15,11,25);

        ctx.fillStyle=t.color;

        roundRect(-27,-48,54,96,13);
        ctx.fill();

        ctx.fillStyle="#38bdf8";

        roundRect(-18,-22,36,31,7);
        ctx.fill();

        ctx.fillStyle="#fff";

        ctx.fillRect(-20,-43,12,7);
        ctx.fillRect(8,-43,12,7);

        ctx.restore();
    });
}

/* ---------------- COINS ---------------- */

function spawnCoin(){

    let lanes=[.18,.5,.82];

    let lane=lanes[Math.floor(Math.random()*lanes.length)];

    let y=-30;

    coins.push({
        x:roadLeft(y)+roadWidth()*lane,
        y:y,
        spin:0
    });
}

function drawCoins(){

    coins.forEach(c=>{

        ctx.save();

        ctx.translate(c.x,c.y);
        ctx.rotate(c.spin);

        ctx.fillStyle="#facc15";
        ctx.shadowBlur=18;
        ctx.shadowColor="#facc15";

        ctx.beginPath();
        ctx.arc(0,0,12,0,Math.PI*2);
        ctx.fill();

        ctx.shadowBlur=0;

        ctx.fillStyle="#92400e";
        ctx.font="bold 13px Arial";
        ctx.textAlign="center";
        ctx.textBaseline="middle";
        ctx.fillText("₹",0,1);

        ctx.restore();
    });
}

/* ---------------- WATER & MUD ---------------- */

function spawnSurface(){

    let y=-80;

    let type=Math.random()<.5?"water":"mud";

    let obj={
        x:roadCenter(y),
        y:y,
        width:Math.min(roadWidth()*.55,270),
        height:45,
        type:type
    };

    if(type==="water")puddles.push(obj);
    else muds.push(obj);
}

function drawSurfaces(){

    puddles.forEach(p=>{

        ctx.fillStyle="rgba(14,165,233,.75)";

        ctx.beginPath();
        ctx.ellipse(p.x,p.y,p.width/2,p.height/2,0,0,Math.PI*2);
        ctx.fill();

        ctx.strokeStyle="#bae6fd";
        ctx.lineWidth=3;

        ctx.beginPath();
        ctx.ellipse(p.x,p.y,p.width/2,p.height/2,0,0,Math.PI*2);
        ctx.stroke();
    });

    muds.forEach(m=>{

        ctx.fillStyle="#78350f";

        ctx.beginPath();
        ctx.ellipse(m.x,m.y,m.width/2,m.height/2,0,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="#92400e";

        for(let i=0;i<7;i++){

            ctx.beginPath();

            ctx.arc(
                m.x+(Math.random()-.5)*m.width,
                m.y+(Math.random()-.5)*20,
                4,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    });
}

/* ---------------- PARTICLES ---------------- */

function particle(x,y,color){

    particles.push({
        x:x,
        y:y,
        vx:(Math.random()-.5)*5,
        vy:(Math.random()-.5)*5,
        life:35,
        color:color
    });
}

function drawParticles(){

    particles.forEach(p=>{

        ctx.globalAlpha=p.life/35;
        ctx.fillStyle=p.color;

        ctx.beginPath();
        ctx.arc(p.x,p.y,4,0,Math.PI*2);
        ctx.fill();
    });

    ctx.globalAlpha=1;
}

/* ---------------- UPDATE ---------------- */

function update(){

    if(!running || paused)return;

    let car=currentCar();

    /* acceleration */

    if(keys.gas)
        player.speed+=.14*car.speed;
    else
        player.speed-=.035;

    /* nitro */

    if(keys.nitro){
        player.speed+=.25*car.nitro;

        if(Math.random()<.4)
            particle(player.x,player.y+55,"#f97316");
    }

    player.speed=Math.max(0,Math.min(player.speed,11*car.speed));

    /* smooth road curve */

    if(Math.random()<.008)
        curveTarget=(Math.random()-.5)*roadWidth()*.45;

    roadCurve+=(curveTarget-roadCurve)*.008;

    /* steering */

    let steer=0;

    if(keys.left)steer-=1;
    if(keys.right)steer+=1;

    let steeringPower=(2.2+player.speed*.35)*car.handling;

    player.x+=steer*steeringPower;

    let targetAngle=steer*.18;

    player.angle+=(targetAngle-player.angle)*.12;

    /* road center */

    let center=roadCenter(player.y);

    let minX=center-roadWidth()/2+35;
    let maxX=center+roadWidth()/2-35;

    if(player.x<minX){
        player.x=minX;
        player.speed*=.98;
    }

    if(player.x>maxX){
        player.x=maxX;
        player.speed*=.98;
    }

    roadScroll+=player.speed*2.7;

    score+=Math.floor(player.speed*.06);

    /* traffic */

    spawnTimer--;

    if(spawnTimer<=0){

        spawnTraffic();

        spawnTimer=Math.max(35,100-player.speed*4);
    }

    traffic.forEach(t=>{

        t.y+=player.speed*1.45-t.speed;

        t.x=roadCenter(t.y)+
            (t.x-roadCenter(t.y))*0.99;
    });

    traffic=traffic.filter(t=>t.y<H+150);

    /* coins */

    coinTimer--;

    if(coinTimer<=0){

        spawnCoin();
        coinTimer=45+Math.random()*60;
    }

    coins.forEach(c=>{

        c.y+=player.speed*1.5;
        c.spin+=.08;
    });

    coins=coins.filter(c=>c.y<H+60);

    /* surfaces */

    surfaceTimer--;

    if(surfaceTimer<=0){

        spawnSurface();
        surfaceTimer=260+Math.random()*300;
    }

    puddles.forEach(p=>p.y+=player.speed*1.5);
    muds.forEach(m=>m.y+=player.speed*1.5);

    puddles=puddles.filter(p=>p.y<H+100);
    muds=muds.filter(m=>m.y<H+100);

    /* coin collision */

    coins.forEach(c=>{

        if(
            Math.abs(player.x-c.x)<38 &&
            Math.abs(player.y-c.y)<60
        ){

            c.collected=true;

            gameCoins++;
            score+=100;

            for(let i=0;i<10;i++)
                particle(c.x,c.y,"#facc15");
        }
    });

    coins=coins.filter(c=>!c.collected);

    /* traffic collision */

    traffic.forEach(t=>{

        if(
            Math.abs(player.x-t.x)<45 &&
            Math.abs(player.y-t.y)<70
        ){

            player.speed*=.4;
            score=Math.max(0,score-100);

            for(let i=0;i<18;i++)
                particle(player.x,player.y,"#ef4444");
        }
    });

    /* mud */

    muds.forEach(m=>{

        if(
            Math.abs(player.x-m.x)<m.width/2 &&
            Math.abs(player.y-m.y)<45
        ){

            player.dirt=Math.min(100,player.dirt+1);

            player.speed*=.994;

            if(Math.random()<.15)
                particle(player.x,player.y,"#78350f");
        }
    });

    /* water */

    puddles.forEach(p=>{

        if(
            Math.abs(player.x-p.x)<p.width/2 &&
            Math.abs(player.y-p.y)<45
        ){

            player.dirt=Math.max(0,player.dirt-3);

            if(Math.random()<.35){

                particle(
                    player.x+(Math.random()-.5)*40,
                    player.y,
                    "#bae6fd"
                );
            }
        }
    });

    /* particles */

    particles.forEach(p=>{

        p.x+=p.vx;
        p.y+=p.vy;
        p.life--;
    });

    particles=particles.filter(p=>p.life>0);

    /* HUD */

    document.getElementById("coins").textContent=gameCoins;
    document.getElementById("score").textContent=score;

    document.getElementById("speed").textContent=
        Math.floor(player.speed*18);

    document.getElementById("carName").textContent=car.name;

    saveGame();

    /* status */

    let status=document.getElementById("mudStatus");

    if(player.dirt>50){

        status.style.display="block";
        status.textContent="🟤 CAR IS DIRTY — FIND WATER 💧";
    }
    else if(player.dirt>0){

        status.style.display="block";
        status.textContent="🟤 MUD ON CAR";
    }
    else{

        status.style.display="none";
    }
}

/* ---------------- SHOP ---------------- */

function renderShop(){

    document.getElementById("shopCoins").textContent=gameCoins;

    let grid=document.getElementById("carGrid");

    grid.innerHTML="";

    defaultCars.forEach(car=>{

        let isOwned=owned.includes(car.id);
        let isSelected=selected===car.id;

        let card=document.createElement("div");

        card.className="carCard";

        card.innerHTML=`

            <div class="carPreview"
                 style="background:${car.color}">
            </div>

            <b>${car.name}</b>

            <div style="font-size:12px;margin:5px">
                ⚡ Speed ${Math.round(car.speed*100)}%
            </div>

            <div style="font-size:12px;margin:5px">
                🪙 ${car.price}
            </div>

            <button class="buyBtn ${!isOwned?"":"locked"}">
                ${
                    isSelected
                    ?"EQUIPPED"
                    :isOwned
                    ?"EQUIP"
                    :car.price+" COINS"
                }
            </button>
        `;

        let button=card.querySelector("button");

        if(isSelected){

            button.disabled=true;

        }else if(isOwned){

            button.onclick=()=>{

                selected=car.id;

                saveGame();
                renderShop();
            };

        }else{

            button.onclick=()=>{

                if(gameCoins>=car.price){

                    gameCoins-=car.price;

                    owned.push(car.id);

                    selected=car.id;

                    saveGame();

                    renderShop();

                }else{

                    alert(
                        "Not enough coins! Collect more coins 🪙"
                    );
                }
            };
        }

        grid.appendChild(card);
    });
}

/* ---------------- BUTTONS ---------------- */

function bind(id,key){

    let el=document.getElementById(id);

    el.addEventListener("pointerdown",e=>{
        e.preventDefault();
        keys[key]=true;
    });

    el.addEventListener("pointerup",e=>{
        e.preventDefault();
        keys[key]=false;
    });

    el.addEventListener("pointercancel",()=>{
        keys[key]=false;
    });

    el.addEventListener("pointerleave",()=>{
        keys[key]=false;
    });
}

bind("left","left");
bind("right","right");
bind("gas","gas");
bind("nitro","nitro");

/* keyboard */

addEventListener("keydown",e=>{

    if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")
        keys.left=true;

    if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")
        keys.right=true;

    if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")
        keys.gas=true;

    if(e.code==="Space")
        keys.nitro=true;
});

addEventListener("keyup",e=>{

    if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")
        keys.left=false;

    if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")
        keys.right=false;

    if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")
        keys.gas=false;

    if(e.code==="Space")
        keys.nitro=false;
});

/* start */

document.getElementById("startBtn").onclick=()=>{
    startGame();
};

document.getElementById("openShopStart").onclick=()=>{
    renderShop();
    document.getElementById("shop").style.display="flex";
};

document.getElementById("shopBtn").onclick=()=>{
    renderShop();
    document.getElementById("shop").style.display="flex";
};

document.getElementById("closeShop").onclick=()=>{
    document.getElementById("shop").style.display="none";
};

document.getElementById("pauseBtn").onclick=()=>{

    if(!running)return;

    paused=true;
    document.getElementById("pauseScreen").style.display="flex";
};

document.getElementById("resumeBtn").onclick=()=>{

    paused=false;
    document.getElementById("pauseScreen").style.display="none";
};

document.getElementById("pauseShop").onclick=()=>{

    renderShop();

    document.getElementById("pauseScreen").style.display="none";
    document.getElementById("shop").style.display="flex";
};

/* ---------------- LOOP ---------------- */

function loop(){

    ctx.clearRect(0,0,W,H);

    drawWorld();
    drawSurfaces();
    drawCoins();
    drawTraffic();
    drawParticles();
    drawPlayer();

    update();

    requestAnimationFrame(loop);
}

loop();
</script>
