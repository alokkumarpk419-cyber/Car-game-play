<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Ultimate Custom Racing</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#090909;
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  max-width:430px;
  margin:auto;
  overflow:hidden;
  background:#25752c;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

/* =========================
   HOME SCREEN
========================= */

.screen{
  position:absolute;
  inset:0;
  z-index:20;
  background:
    radial-gradient(circle at 50% 20%,#442000,#111 45%,#050505);
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.hidden{
  display:none!important;
}

.logo{
  font-size:31px;
  font-weight:900;
  color:#ffd400;
  text-shadow:0 0 12px #ff6500,0 0 30px #ff3000;
}

.subtitle{
  margin:8px 0 20px;
  color:#bbb;
  font-size:12px;
  letter-spacing:3px;
}

button{
  border:0;
  border-radius:25px;
  padding:13px 30px;
  margin:6px;
  min-width:190px;
  background:linear-gradient(135deg,#ffd400,#ff6500);
  color:#111;
  font-size:16px;
  font-weight:900;
}

button:active{
  transform:scale(.94);
}

.dark{
  background:#20242c;
  color:white;
  border:1px solid #555;
}

/* =========================
   CAR PREVIEW
========================= */

.preview{
  width:180px;
  height:100px;
  margin:15px;
  position:relative;
}

.previewBody{
  position:absolute;
  left:10px;
  top:35px;
  width:160px;
  height:50px;
  border-radius:30px 35px 12px 12px;
  background:#ff2020;
  border:3px solid white;
}

.previewRoof{
  position:absolute;
  left:55px;
  top:10px;
  width:75px;
  height:45px;
  border-radius:40px 40px 4px 4px;
  background:#b40000;
  border:3px solid white;
}

.wheel{
  position:absolute;
  bottom:4px;
  width:35px;
  height:35px;
  background:#050505;
  border:6px solid #555;
  border-radius:50%;
  z-index:3;
}

.w1{left:28px}
.w2{right:28px}

/* =========================
   GARAGE
========================= */

#garage{
  justify-content:flex-start;
  padding-top:25px;
  overflow-y:auto;
}

.title{
  color:#ffd400;
  font-size:28px;
  font-weight:bold;
  margin-bottom:5px;
}

.coinsTop{
  background:#151515;
  border:1px solid #ffd400;
  border-radius:20px;
  padding:8px 18px;
  color:#ffd400;
  font-weight:bold;
  margin-bottom:15px;
}

#cars{
  width:100%;
  max-width:370px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.carBox{
  position:relative;
  height:92px;
  border-radius:15px;
  border:3px solid #444;
  background:#222;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:10px;
  font-weight:bold;
  cursor:pointer;
}

.carMini{
  width:65px;
  height:28px;
  border-radius:15px 20px 7px 7px;
  border:2px solid white;
  margin-bottom:5px;
}

.carBox.selected{
  border-color:#ffd400;
  box-shadow:0 0 15px #ffd400;
}

.lock{
  position:absolute;
  inset:0;
  background:#0009;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:20px;
}

.lock small{
  font-size:9px;
  color:#ffd400;
  margin-top:3px;
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  inset:0;
  z-index:100;
  pointer-events:none;
}

.hud{
  position:absolute;
  top:10px;
  padding:7px 10px;
  background:#000c;
  color:white;
  border:1px solid #ffd400;
  border-radius:12px;
  font-size:12px;
  font-weight:bold;
}

#score{left:8px}
#coins{
  left:8px;
  top:48px;
  color:#ffd400;
}

#level{right:8px}

#distance{
  left:50%;
  transform:translateX(-50%);
}

#health{
  position:absolute;
  left:8px;
  top:82px;
  width:110px;
  height:10px;
  background:#222;
  border:1px solid white;
  border-radius:10px;
  overflow:hidden;
}

#healthBar{
  width:100%;
  height:100%;
  background:#16e878;
}

#nitro{
  position:absolute;
  left:8px;
  top:98px;
  width:110px;
  height:10px;
  background:#222;
  border:1px solid white;
  border-radius:10px;
  overflow:hidden;
}

#nitroBar{
  width:100%;
  height:100%;
  background:#00d9ff;
}

/* =========================
   PAUSE
========================= */

#pause{
  position:absolute;
  top:48px;
  right:8px;
  min-width:45px;
  width:45px;
  height:40px;
  padding:0;
  margin:0;
  background:#111d;
  color:white;
  border:1px solid white;
  pointer-events:auto;
  z-index:9999;
}

/* =========================
   IMPORTANT MOBILE CONTROLS
========================= */

.control{
  position:absolute;

  /* Moved higher so buttons do not get cut off */
  bottom:70px;

  width:76px;
  height:76px;

  border-radius:50%;

  background:rgba(15,15,15,.92);

  border:3px solid #ffd400;

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:29px;
  font-weight:bold;

  pointer-events:auto;
  user-select:none;

  /* VERY HIGH Z-INDEX */
  z-index:9999;

  /* Prevent browser gestures */
  touch-action:none;

  box-shadow:
    0 4px 15px #000,
    0 0 10px #ffd40055;
}

.control:active{
  transform:scale(.92);
  background:#ffd400;
  color:#000;
}

#left{
  left:18px;
}

#right{
  right:18px;
}

/* Nitro button */

#nitroBtn{
  position:absolute;

  /* Moved higher */
  bottom:78px;

  left:50%;
  transform:translateX(-50%);

  min-width:105px;
  width:105px;
  height:48px;

  padding:0;
  margin:0;

  background:linear-gradient(135deg,#00c8ff,#0066ff);

  color:white;

  border:2px solid white;
  border-radius:25px;

  font-size:13px;
  font-weight:900;

  pointer-events:auto;
  user-select:none;

  /* VERY HIGH Z-INDEX */
  z-index:9999;

  touch-action:none;

  box-shadow:
    0 4px 15px #000,
    0 0 12px #009dff;
}

#nitroBtn:active{
  transform:translateX(-50%) scale(.92);
}

/* Extra protection for phones with safe areas */

@supports(padding:max(0px)){
  .control{
    bottom:max(70px,calc(70px + env(safe-area-inset-bottom)));
  }

  #nitroBtn{
    bottom:max(78px,calc(78px + env(safe-area-inset-bottom)));
  }
}

/* Small screen adjustment */

@media(max-height:600px){

  .control{
    bottom:58px;
    width:68px;
    height:68px;
  }

  #nitroBtn{
    bottom:64px;
    height:44px;
  }

  @supports(padding:max(0px)){
    .control{
      bottom:max(58px,calc(58px + env(safe-area-inset-bottom)));
    }

    #nitroBtn{
      bottom:max(64px,calc(64px + env(safe-area-inset-bottom)));
    }
  }
}

/* =========================
   OVERLAYS
========================= */

.overlay{
  position:absolute;
  inset:0;
  z-index:30000;
  background:#000d;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.overlay h1{
  color:#ffd400;
  font-size:36px;
  text-shadow:0 0 15px #ff5000;
}

.stats{
  margin:15px;
  padding:15px 30px;
  background:#151820;
  border-radius:15px;
  border:1px solid #444;
}

.stats p{
  margin:8px;
}

.stats b{
  color:#ffd400;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<!-- HOME -->

<div id="home" class="screen">

  <div class="logo">
    ULTIMATE<br>
    CUSTOM RACING
  </div>

  <div class="subtitle">
    DRIVE • COLLECT • UNLOCK
  </div>

  <div class="preview">

    <div id="previewBody" class="previewBody"></div>

    <div id="previewRoof" class="previewRoof"></div>

    <div class="wheel w1"></div>
    <div class="wheel w2"></div>

  </div>

  <button onclick="startGame()">PLAY RACE</button>

  <button onclick="openGarage()">GARAGE</button>

  <button class="dark" onclick="resetProgress()">
    RESET PROGRESS
  </button>

</div>

<!-- GARAGE -->

<div id="garage" class="screen hidden">

  <div class="title">CAR GARAGE</div>

  <div class="coinsTop">
    🪙 COINS:
    <span id="garageCoins">0</span>
  </div>

  <div id="cars"></div>

  <button onclick="closeGarage()">BACK</button>

</div>

<!-- HUD -->

<div id="hud" class="hidden">

  <div id="score" class="hud">
    SCORE: 0
  </div>

  <div id="coins" class="hud">
    🪙 0
  </div>

  <div id="distance" class="hud">
    0 M
  </div>

  <div id="level" class="hud">
    LEVEL 1
  </div>

  <div id="health">
    <div id="healthBar"></div>
  </div>

  <div id="nitro">
    <div id="nitroBar"></div>
  </div>

  <!-- Pause -->

  <button id="pause">Ⅱ</button>

  <!-- TOUCH CONTROLS -->

  <div id="left" class="control">
    ◀
  </div>

  <div id="right" class="control">
    ▶
  </div>

  <button id="nitroBtn">
    NITRO
  </button>

</div>

<!-- PAUSE -->

<div id="pauseScreen" class="overlay hidden">

  <h1>PAUSED</h1>

  <button onclick="resumeGame()">RESUME</button>

  <button onclick="restartGame()">RESTART</button>

  <button class="dark" onclick="goHome()">HOME</button>

</div>

<!-- GAME OVER -->

<div id="gameOver" class="overlay hidden">

  <h1>GAME OVER</h1>

  <div class="stats">

    <p>
      SCORE:
      <b id="finalScore">0</b>
    </p>

    <p>
      COINS:
      <b id="finalCoins">0</b>
    </p>

    <p>
      DISTANCE:
      <b id="finalDistance">0</b> M
    </p>

    <p>
      BEST:
      <b id="bestScore">0</b>
    </p>

  </div>

  <button onclick="restartGame()">RETRY</button>

  <button onclick="openGarageFromGame()">GARAGE</button>

  <button class="dark" onclick="goHome()">HOME</button>

</div>

<script>

/* =========================
   CANVAS
========================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0,H=0;

function resize(){

  W=canvas.width=
    window.innerWidth>430
    ?430
    :window.innerWidth;

  H=canvas.height=window.innerHeight;

}

resize();

window.addEventListener("resize",resize);


/* =========================
   CAR DATA
========================= */

const carList=[

 {name:"Red Racer",color:"#ff2020",cost:0},

 {name:"Blue Storm",color:"#168cff",cost:100},

 {name:"Green Beast",color:"#18e66a",cost:200},

 {name:"Orange Fire",color:"#ff8c00",cost:300},

 {name:"Purple X",color:"#a600ff",cost:400},

 {name:"Pink Rush",color:"#ff1688",cost:500},

 {name:"Cyan GT",color:"#00e5ff",cost:600},

 {name:"Yellow Bolt",color:"#ffe600",cost:700},

 {name:"White Phantom",color:"#ffffff",cost:800},

 {name:"Black Shadow",color:"#222222",cost:900},

 {name:"Gold King",color:"#d9a400",cost:1000},

 {name:"Neon Ultra",color:"#7cff00",cost:1100}

];

let totalCoins=
  Number(localStorage.getItem("coins")||0);

let selected=
  Number(localStorage.getItem("selectedCar")||0);

let best=
  Number(localStorage.getItem("best")||0);


/* =========================
   GAME VARIABLES
========================= */

let running=false;
let paused=false;

let score=0;
let distance=0;
let health=100;
let nitro=100;

let roadOffset=0;
let lastTime=0;
let spawnTimer=0;

let left=false;
let right=false;
let boosting=false;

let traffic=[];
let coins=[];
let particles=[];

const player={
  x:0,
  y:0,
  w:44,
  h:78
};


/* =========================
   AUDIO
========================= */

let audio=null;
let engineOsc=null;
let engineGain=null;

function initAudio(){

  try{

    if(!audio){

      audio=
        new(
          window.AudioContext||
          window.webkitAudioContext
        )();

    }

    if(audio.state==="suspended"){
      audio.resume();
    }

  }catch(e){}

}

function sound(
  freq,
  duration,
  type="sine",
  volume=.05
){

  try{

    initAudio();

    const osc=audio.createOscillator();
    const gain=audio.createGain();

    osc.type=type;
    osc.frequency.value=freq;

    gain.gain.setValueAtTime(
      volume,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();

    osc.stop(
      audio.currentTime+duration
    );

  }catch(e){}

}

function startEngine(){

  try{

    initAudio();

    if(engineOsc)return;

    engineOsc=
      audio.createOscillator();

    engineGain=
      audio.createGain();

    engineOsc.type="sawtooth";

    engineOsc.frequency.value=75;

    engineGain.gain.value=.025;

    engineOsc.connect(engineGain);

    engineGain.connect(
      audio.destination
    );

    engineOsc.start();

  }catch(e){}

}

function stopEngine(){

  try{

    if(engineOsc){

      engineOsc.stop();

      engineOsc=null;

    }

  }catch(e){}

}


/* =========================
   GARAGE
========================= */

function buildGarage(){

  const box=
    document.getElementById("cars");

  box.innerHTML="";

  document.getElementById(
    "garageCoins"
  ).textContent=totalCoins;

  carList.forEach((car,i)=>{

    const unlocked=
      totalCoins>=car.cost;

    const div=
      document.createElement("div");

    div.className="carBox";

    if(i===selected){
      div.classList.add("selected");
    }

    div.innerHTML=`

      <div
        class="carMini"
        style="background:${car.color}"
      ></div>

      ${car.name}

      ${
        unlocked
        ?""
        :`
          <div class="lock">
            🔒
            <small>
              ${car.cost} COINS
            </small>
          </div>
        `
      }

    `;

    div.onclick=()=>{

      if(!unlocked){

        sound(
          120,
          .12,
          "square"
        );

        alert(
          "LOCKED\n\n" +
          "Collect " +
          (car.cost-totalCoins) +
          " more coins."
        );

        return;

      }

      selected=i;

      localStorage.setItem(
        "selectedCar",
        selected
      );

      sound(700,.1);

      buildGarage();
      updatePreview();

    };

    box.appendChild(div);

  });

}

function updatePreview(){

  const car=carList[selected];

  document.getElementById(
    "previewBody"
  ).style.background=car.color;

  document.getElementById(
    "previewRoof"
  ).style.background=
    darken(car.color,45);

}

function darken(hex,n){

  if(hex==="#ffffff"){
    return"#777";
  }

  let r=
    parseInt(hex.slice(1,3),16);

  let g=
    parseInt(hex.slice(3,5),16);

  let b=
    parseInt(hex.slice(5,7),16);

  r=Math.max(0,r-n);
  g=Math.max(0,g-n);
  b=Math.max(0,b-n);

  return "#"+
    r.toString(16).padStart(2,"0")+
    g.toString(16).padStart(2,"0")+
    b.toString(16).padStart(2,"0");

}


/* =========================
   SCREENS
========================= */

function openGarage(){

  running=false;

  stopEngine();

  document.getElementById(
    "home"
  ).classList.add("hidden");

  document.getElementById(
    "garage"
  ).classList.remove("hidden");

  document.getElementById(
    "hud"
  ).classList.add("hidden");

  buildGarage();

}

function closeGarage(){

  document.getElementById(
    "garage"
  ).classList.add("hidden");

  document.getElementById(
    "home"
  ).classList.remove("hidden");

}

function openGarageFromGame(){

  document.getElementById(
    "gameOver"
  ).classList.add("hidden");

  openGarage();

}

function goHome(){

  running=false;
  paused=false;

  stopEngine();

  document.getElementById(
    "hud"
  ).classList.add("hidden");

  document.getElementById(
    "pauseScreen"
  ).classList.add("hidden");

  document.getElementById(
    "gameOver"
  ).classList.add("hidden");

  document.getElementById(
    "garage"
  ).classList.add("hidden");

  document.getElementById(
    "home"
  ).classList.remove("hidden");

}

function resetProgress(){

  if(
    !confirm(
      "Reset all coins and unlocked cars?"
    )
  )return;

  totalCoins=0;
  selected=0;
  best=0;

  localStorage.removeItem("coins");
  localStorage.removeItem("selectedCar");
  localStorage.removeItem("best");

  buildGarage();
  updatePreview();

  alert("Progress reset.");

}


/* =========================
   ROAD
========================= */

function road(){

  const width=W*.74;

  const left=(W-width)/2;

  ctx.fillStyle="#247c2b";

  ctx.fillRect(
    0,0,W,H
  );

  ctx.fillStyle="#303238";

  ctx.fillRect(
    left,
    0,
    width,
    H
  );

  ctx.fillStyle="#ddd";

  ctx.fillRect(
    left,
    0,
    4,
    H
  );

  ctx.fillRect(
    left+width-4,
    0,
    4,
    H
  );

  ctx.strokeStyle="#fff";

  ctx.lineWidth=4;

  ctx.setLineDash([
    25,
    25
  ]);

  ctx.lineDashOffset=
    -roadOffset;

  for(
    let i=1;
    i<3;
    i++
  ){

    const lx=
      left+width*i/3;

    ctx.beginPath();

    ctx.moveTo(lx,0);

    ctx.lineTo(lx,H);

    ctx.stroke();

  }

  ctx.setLineDash([]);

  return{
    left,
    width
  };

}


/* =========================
   PLAYER
========================= */

function drawPlayer(){

  const car=carList[selected];

  const x=player.x;
  const y=player.y;

  ctx.save();

  ctx.fillStyle="#0007";

  ctx.beginPath();

  ctx.ellipse(
    x+22,
    y+76,
    28,
    7,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#050505";

  ctx.fillRect(
    x-5,y+13,7,19
  );

  ctx.fillRect(
    x+42,y+13,7,19
  );

  ctx.fillRect(
    x-5,y+47,7,19
  );

  ctx.fillRect(
    x+42,y+47,7,19
  );

  const g=
    ctx.createLinearGradient(
      x,0,x+44,0
    );

  g.addColorStop(
    0,
    darken(car.color,45)
  );

  g.addColorStop(
    .5,
    car.color
  );

  g.addColorStop(
    1,
    darken(car.color,55)
  );

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.roundRect(
    x,
    y,
    44,
    78,
    11
  );

  ctx.fill();

  ctx.strokeStyle="#fff";

  ctx.lineWidth=2;

  ctx.stroke();

  ctx.fillStyle=
    darken(car.color,30);

  ctx.beginPath();

  ctx.roundRect(
    x+7,
    y+15,
    30,
    33,
    9
  );

  ctx.fill();

  ctx.fillStyle="#111";

  ctx.fillRect(
    x+10,
    y+18,
    24,
    13
  );

  ctx.fillStyle="#70dfff";

  ctx.fillRect(
    x+12,
    y+20,
    20,
    3
  );

  ctx.fillStyle="#fff8a0";

  ctx.shadowBlur=10;

  ctx.shadowColor="#ffff00";

  ctx.fillRect(
    x+6,
    y+4,
    9,
    5
  );

  ctx.fillRect(
    x+29,
    y+4,
    9,
    5
  );

  ctx.shadowBlur=0;

  ctx.fillStyle="#111";

  ctx.fillRect(
    x+5,
    y+69,
    34,
    4
  );

  if(boosting){

    ctx.fillStyle="#00eaff";

    ctx.shadowBlur=18;

    ctx.shadowColor="#00eaff";

    ctx.beginPath();

    ctx.moveTo(
      x+13,
      y+73
    );

    ctx.lineTo(
      x+22,
      y+100
    );

    ctx.lineTo(
      x+31,
      y+73
    );

    ctx.fill();

    ctx.shadowBlur=0;

  }

  ctx.restore();

}


/* =========================
   TRAFFIC
========================= */

function spawnTraffic(){

  const r=road();

  const lane=
    Math.floor(
      Math.random()*3
    );

  traffic.push({

    x:
      r.left+
      r.width*(lane+.5)/3-
      20,

    y:-90,

    speed:
      2+
      Math.random()*2,

    color:[
      "#168cff",
      "#18e66a",
      "#ff8c00",
      "#a600ff",
      "#fff",
      "#ff1688"
    ][
      Math.floor(
        Math.random()*6
      )
    ]

  });

}

function drawTraffic(q){

  ctx.fillStyle="#0007";

  ctx.fillRect(
    q.x+3,
    q.y+5,
    40,
    68
  );

  ctx.fillStyle=q.color;

  ctx.beginPath();

  ctx.roundRect(
    q.x,
    q.y,
    40,
    70,
    9
  );

  ctx.fill();

  ctx.fillStyle="#111";

  ctx.fillRect(
    q.x+6,
    q.y+14,
    28,
    20
  );

  ctx.fillStyle="#68dfff";

  ctx.fillRect(
    q.x+8,
    q.y+16,
    24,
    15
  );

  ctx.fillStyle="#000";

  ctx.fillRect(
    q.x-4,
    q.y+12,
    5,
    17
  );

  ctx.fillRect(
    q.x+39,
    q.y+12,
    5,
    17
  );

  ctx.fillRect(
    q.x-4,
    q.y+45,
    5,
    17
  );

  ctx.fillRect(
    q.x+39,
    q.y+45,
    5,
    17
  );

}


/* =========================
   COINS
========================= */

function spawnCoin(){

  const r=road();

  const lane=
    Math.floor(
      Math.random()*3
    );

  coins.push({

    x:
      r.left+
      r.width*(lane+.5)/3,

    y:-30,

    size:12

  });

}

function drawCoin(q){

  ctx.save();

  ctx.fillStyle="#ffd400";

  ctx.shadowBlur=12;

  ctx.shadowColor="#ff9d00";

  ctx.beginPath();

  ctx.arc(
    q.x,
    q.y,
    q.size,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#fff3a0";

  ctx.font="bold 11px Arial";

  ctx.textAlign="center";

  ctx.fillText(
    "$",
    q.x,
    q.y+4
  );

  ctx.restore();

}


/* =========================
   COLLISION
========================= */

function hit(
  a,
  b,
  w=40,
  h=70
){

  return(
    a.x<b.x+w &&
    a.x+a.w>b.x &&
    a.y<b.y+h &&
    a.y+a.h>b.y
  );

}

function coinHit(q){

  return(
    player.x<
      q.x+q.size&&

    player.x+player.w>
      q.x-q.size&&

    player.y<
      q.y+q.size&&

    player.y+player.h>
      q.y-q.size
  );

}


/* =========================
   EXPLOSION
========================= */

function explosion(x,y){

  for(
    let i=0;
    i<45;
    i++
  ){

    particles.push({

      x:x,
      y:y,

      vx:
        (Math.random()-.5)*12,

      vy:
        (Math.random()-.5)*12,

      life:1,

      size:
        Math.random()*7+2,

      color:
        Math.random()>.5
        ?" #ffd400"
        :"#ff3b00"

    });

  }

  sound(
    80,
    .5,
    "sawtooth",
    .2
  );

  if(navigator.vibrate){

    navigator.vibrate([
      100,
      50,
      200
    ]);

  }

}

function drawParticles(){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=.3;
    p.life-=.035;

    if(p.life<=0){

      particles.splice(i,1);

      continue;

    }

    ctx.globalAlpha=p.life;

    ctx.fillStyle=p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha=1;

}


/* =========================
   START
========================= */

function startGame(){

  initAudio();
  startEngine();

  document.getElementById(
    "home"
  ).classList.add("hidden");

  document.getElementById(
    "garage"
  ).classList.add("hidden");

  document.getElementById(
    "gameOver"
  ).classList.add("hidden");

  document.getElementById(
    "pauseScreen"
  ).classList.add("hidden");

  document.getElementById(
    "hud"
  ).classList.remove("hidden");

  score=0;
  distance=0;
  health=100;
  nitro=100;

  traffic=[];
  coins=[];
  particles=[];

  roadOffset=0;
  spawnTimer=0;

  const r=road();

  player.x=
    W/2-player.w/2;

  player.y=
    H-140;

  running=true;
  paused=false;

  lastTime=
    performance.now();

  requestAnimationFrame(loop);

}


/* =========================
   UPDATE
========================= */

function update(dt){

  const r=road();

  let speed=4;

  if(
    boosting &&
    nitro>0
  ){

    speed=8;

    nitro-=35*dt;

  }else{

    nitro+=12*dt;

  }

  nitro=
    Math.max(
      0,
      Math.min(100,nitro)
    );

  /* IMPORTANT:
     Continuous smooth movement */

  const steer=300;

  if(left){

    player.x-=
      steer*dt;

  }

  if(right){

    player.x+=
      steer*dt;

  }

  player.x=
    Math.max(
      r.left+6,
      Math.min(
        r.left+
        r.width-
        player.w-
        6,
        player.x
      )
    );

  roadOffset+=
    speed*50*dt;

  distance+=
    speed*dt*2;

  score+=
    speed*dt*3;

  spawnTimer-=dt;

  if(
    spawnTimer<=0
  ){

    spawnTraffic();

    spawnTimer=
      Math.max(
        .45,
        1.1-distance/4000
      );

  }

  if(
    Math.random()<
    .018*dt*60
  ){

    spawnCoin();

  }

  /* TRAFFIC */

  for(
    let i=traffic.length-1;
    i>=0;
    i--
  ){

    const q=traffic[i];

    q.y+=
      (q.speed+speed)*
      60*dt;

    if(
      hit(player,q)
    ){

      explosion(
        player.x+22,
        player.y+35
      );

      health-=35;

      traffic.splice(i,1);

      continue;

    }

    if(q.y>H+100){

      traffic.splice(i,1);

    }

  }

  /* COINS */

  for(
    let i=coins.length-1;
    i>=0;
    i--
  ){

    const q=coins[i];

    q.y+=
      speed*60*dt;

    if(
      coinHit(q)
    ){

      totalCoins++;

      localStorage.setItem(
        "coins",
        totalCoins
      );

      score+=25;

      sound(
        800,
        .1,
        "sine",
        .08
      );

      coins.splice(i,1);

      buildGarage();

      continue;

    }

    if(q.y>H+50){

      coins.splice(i,1);

    }

  }

  document.getElementById(
    "score"
  ).textContent=
    "SCORE: "+
    Math.floor(score);

  document.getElementById(
    "coins"
  ).textContent=
    "🪙 "+
    totalCoins;

  document.getElementById(
    "distance"
  ).textContent=
    Math.floor(distance)+" M";

  const level=
    Math.min(
      5,
      Math.floor(distance/500)+1
    );

  document.getElementById(
    "level"
  ).textContent=
    "LEVEL "+level;

  document.getElementById(
    "healthBar"
  ).style.width=
    health+"%";

  document.getElementById(
    "nitroBar"
  ).style.width=
    nitro+"%";

  if(health<=0){

    gameOver();

  }

}


/* =========================
   DRAW
========================= */

function draw(){

  ctx.clearRect(
    0,0,W,H
  );

  road();

  traffic.forEach(
    drawTraffic
  );

  coins.forEach(
    drawCoin
  );

  drawPlayer();

  drawParticles();

}


/* =========================
   LOOP
========================= */

function loop(time){

  if(!running)return;

  if(paused){

    requestAnimationFrame(loop);

    return;

  }

  const dt=
    Math.min(
      (time-lastTime)/1000,
      .035
    );

  lastTime=time;

  update(dt);
  draw();

  requestAnimationFrame(loop);

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

  running=false;

  stopEngine();

  explosion(
    player.x+22,
    player.y+35
  );

  if(
    score>best
  ){

    best=
      Math.floor(score);

    localStorage.setItem(
      "best",
      best
    );

  }

  document.getElementById(
    "hud"
  ).classList.add("hidden");

  document.getElementById(
    "finalScore"
  ).textContent=
    Math.floor(score);

  document.getElementById(
    "finalCoins"
  ).textContent=
    totalCoins;

  document.getElementById(
    "finalDistance"
  ).textContent=
    Math.floor(distance);

  document.getElementById(
    "bestScore"
  ).textContent=
    best;

  document.getElementById(
    "gameOver"
  ).classList.remove("hidden");

}


/* =========================
   PAUSE
========================= */

document.getElementById(
  "pause"
).addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    paused=true;

    document.getElementById(
      "pauseScreen"
    ).classList.remove("hidden");

  }
);

function resumeGame(){

  paused=false;

  document.getElementById(
    "pauseScreen"
  ).classList.add("hidden");

  lastTime=
    performance.now();

}

function restartGame(){

  startGame();

}


/* =========================
   TOUCH CONTROLS
========================= */

function control(id,type){

  const el=
    document.getElementById(id);

  const down=e=>{

    e.preventDefault();

    initAudio();

    if(
      e.pointerId!==undefined &&
      el.setPointerCapture
    ){

      try{
        el.setPointerCapture(
          e.pointerId
        );
      }catch(err){}

    }

    if(type==="left"){
      left=true;
    }

    if(type==="right"){
      right=true;
    }

    if(type==="nitro"){
      boosting=true;
    }

  };

  const up=e=>{

    e.preventDefault();

    if(type==="left"){
      left=false;
    }

    if(type==="right"){
      right=false;
    }

    if(type==="nitro"){
      boosting=false;
    }

  };

  el.addEventListener(
    "pointerdown",
    down,
    {passive:false}
  );

  el.addEventListener(
    "pointerup",
    up,
    {passive:false}
  );

  el.addEventListener(
    "pointercancel",
    up,
    {passive:false}
  );

  el.addEventListener(
    "lostpointercapture",
    up,
    {passive:false}
  );

}

control("left","left");
control("right","right");
control("nitroBtn","nitro");


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft"||
      e.key.toLowerCase()==="a"
    ){

      e.preventDefault();
      left=true;

    }

    if(
      e.key==="ArrowRight"||
      e.key.toLowerCase()==="d"
    ){

      e.preventDefault();
      right=true;

    }

    if(e.code==="Space"){

      e.preventDefault();
      boosting=true;

    }

    if(
      e.key.toLowerCase()==="p" &&
      running
    ){

      paused=!paused;

      document.getElementById(
        "pauseScreen"
      ).classList.toggle(
        "hidden",
        !paused
      );

    }

  }
);

window.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowLeft"||
      e.key.toLowerCase()==="a"
    ){

      left=false;

    }

    if(
      e.key==="ArrowRight"||
      e.key.toLowerCase()==="d"
    ){

      right=false;

    }

    if(e.code==="Space"){

      boosting=false;

    }

  }
);


/* =========================
   INITIALIZE
========================= */

updatePreview();
buildGarage();

</script>
